services:
  claudesec:
    build: .
    image: claudesec:latest
    container_name: claudesec
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    volumes:
      # Everything that must outlive an image upgrade: the SQLite ledger
      # (/data/spans.db), the audit signing key and tail anchor
      # (/data/claudesec/hooks), custom rules (/data/rules.json) and the hourly
      # exports (/data/exports). The paths are set as ENV in the Dockerfile so
      # they hold for a plain `docker run` too — do not rely on this file alone.
      #
      # NOTE for bind mounts: replacing this named volume with a host directory
      # on macOS or Windows can silently drop the 0600 mode ClaudeSec sets on the
      # database, because the file-sharing layer synthesises permissions. A named
      # volume is stored on the Linux VM's own filesystem and keeps them.
      - claudesec-data:/data
    environment:
      NODE_ENV: production
      PORT: 3000
      CLAUDESEC_HOST: 0.0.0.0
      # CLAUDESEC_TRUST_LOCAL disables the loopback-address auth check so that
      # the browser can reach /api/* and Socket.io without a token, even though
      # Docker's port-forwarding means the container sees a bridge IP (not
      # 127.0.0.1) for every connection.
      #
      # WARNING: This disables authentication for ALL clients that reach the
      # published port.  It is safe here ONLY because the host port is published
      # on 127.0.0.1 (see the `ports:` entry above) — the container is
      # unreachable from any other machine on the network.
      #
      # If you change the `ports:` binding away from 127.0.0.1 (e.g. to
      # expose it on a LAN or public interface), you MUST remove
      # CLAUDESEC_TRUST_LOCAL and set CLAUDESEC_TOKEN to a strong secret.
      #
      # To use token auth instead of TRUST_LOCAL, comment out the line below
      # and uncomment: # CLAUDESEC_TOKEN: your-secret-token-here
      CLAUDESEC_TRUST_LOCAL: "1"
      # CLAUDESEC_TOKEN:
      # Webhook (optional — set in .env or shell)
      CLAUDESEC_WEBHOOK_URL: ${CLAUDESEC_WEBHOOK_URL:-}
      CLAUDESEC_WEBHOOK_THRESHOLD: ${CLAUDESEC_WEBHOOK_THRESHOLD:-high}
      # Retention (optional). Set BOTH together: ingestion pauses at 90% of the
      # span ceiling, and pruning cannot free spans still inside the window — so
      # a ceiling below the window's own volume stops recording early. 200,000
      # holds a 30-day window at up to ~6,000 spans/day. For the six-month
      # (Minimum) profile use 183 days with 1000000; 0 on both means unbounded.
      CLAUDESEC_MAX_SPANS: ${CLAUDESEC_MAX_SPANS:-200000}
      CLAUDESEC_RETENTION_DAYS: ${CLAUDESEC_RETENTION_DAYS:-30}
      # OTLP forwarding (optional — send traces to upstream collector)
      OTEL_FORWARD_URL: ${OTEL_FORWARD_URL:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # On-demand demo container.
  #
  # Lives behind the `demo` Compose profile so a plain `docker compose up` never
  # starts it. Bring it up with `docker compose --profile demo up` (or
  # `./start.sh --demo`), which starts BOTH this service and the prod one above.
  #
  # ISOLATION: this service has its OWN named volume (claudesec-demo-data) that
  # is never shared with prod. It seeds itself with synthetic data on first boot
  # (CLAUDESEC_SEED_DEMO=1), so it can be shown to people without exposing any
  # real telemetry. There is no toggle and no per-row tagging — the separation
  # is physical (a different database volume).
  demo:
    build: .
    image: claudesec:latest
    container_name: claudesec-demo
    profiles: ["demo"]
    ports:
      # Published on 127.0.0.1 only, on a separate host port (3001 by default)
      # so prod (:3000) and demo (:3001) can run side by side.
      - "127.0.0.1:${DEMO_PORT:-3001}:3000"
    volumes:
      # Dedicated volume — physically isolated from prod's claudesec-data. The
      # /data layout (database, audit key, rules, exports) is the same; the
      # image's ENV points at it, so the demo's synthetic data persists in ITS
      # volume and can never reach prod's.
      - claudesec-demo-data:/data
    environment:
      NODE_ENV: production
      PORT: 3000
      CLAUDESEC_HOST: 0.0.0.0
      # Same loopback-trust rationale as the prod service above: safe ONLY
      # because the host port is published on 127.0.0.1.
      CLAUDESEC_TRUST_LOCAL: "1"
      # Seed the synthetic demo scenarios on first boot (only when the DB is
      # empty — see server/index.ts). Persists in the demo volume thereafter.
      CLAUDESEC_SEED_DEMO: "1"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  claudesec-data:
  claudesec-demo-data:
