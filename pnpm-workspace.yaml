# pnpm 11.x workspace settings.
# Build scripts are blocked for all packages by default in pnpm 10+.
# Allowlist packages that need native compilation or binary bundling.
allowBuilds:
  better-sqlite3: true
  esbuild: true
  re2: true

# Force-patch transitive deps to clear known advisories (pnpm reads overrides here
# in 11.x, not from package.json). esbuild <0.28.1 (GHSA-gv7w-rqvm-qjhr) reaches us
# only through vite/tsx/tailwind; 0.28.1 is a drop-in patch.
overrides:
  esbuild: ">=0.28.1"
