name: Release Please

on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release PR & tag
    runs-on: ubuntu-latest
    steps:
      # Maintains a release PR that bumps the version and CHANGELOG from
      # Conventional Commits. Merging that PR tags the release and publishes
      # the GitHub Release page. See .github/RELEASING.md.
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
