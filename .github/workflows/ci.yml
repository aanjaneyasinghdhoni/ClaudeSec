name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    name: Type-check & Build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ensure no database/data files are tracked
        run: |
          if git ls-files | grep -iE '\.(db|sqlite|sqlite3)(-shm|-wal|-journal)?$'; then
            echo "ERROR: database/data file is tracked in git — remove it and add to .gitignore"
            exit 1
          fi
          if git ls-files docs/_local | grep -q .; then
            echo "ERROR: docs/_local/ holds local working notes and must never be tracked"
            exit 1
          fi

      # Fast (sub-second) scan of every tracked file for real credentials and any
      # private path / email that would leak the maintainer's setup. Runs locally
      # in preflight too; cheap enough to gate every push and PR here as well.
      - name: Scan for secrets & private data
        run: node scripts/scan-secrets.mjs

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Type-check
        run: pnpm lint

      - name: Build
        run: pnpm build

  consistency:
    name: Docs & version consistency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x

      # Fails if version / changelog / rule-count facts drift out of sync.
      # See .github/RELEASING.md.
      - name: Check release-fact consistency
        run: node scripts/check-consistency.mjs
