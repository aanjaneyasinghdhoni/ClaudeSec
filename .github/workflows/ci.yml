name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    name: Type-check & Build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ensure no database/data files are tracked
        run: |
          if git ls-files | grep -iE '\.(db|sqlite|sqlite3)(-shm|-wal|-journal)?$'; then
            echo "ERROR: database/data file is tracked in git — remove it and add to .gitignore"
            exit 1
          fi
          if git ls-files docs/_local | grep -q .; then
            echo "ERROR: docs/_local/ holds local working notes and must never be tracked"
            exit 1
          fi

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Type-check
        run: pnpm lint

      - name: Build
        run: pnpm build

  consistency:
    name: Docs & version consistency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.x

      # Fails if version / changelog / rule-count facts drift out of sync.
      # See .github/RELEASING.md.
      - name: Check release-fact consistency
        run: node scripts/check-consistency.mjs
